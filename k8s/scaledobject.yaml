apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: email
spec:
  scaleTargetRef:
    name: email
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 5
  fallback:
    failureThreshold: 3
    replicas: 1
  advanced:
    horizontalPodAutoscalerConfig:
      name: email
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 2
              periodSeconds: 10
        scaleDown:
          stabilizationWindowSeconds: 120
          policies:
            - type: Pods
              value: 1
              periodSeconds: 60
  triggers:
    - type: prometheus
      name: queue-depth
      metricType: AverageValue
      metadata:
        serverAddress: http://prometheus.infra:9090
        query: sum(rabbitmq_queue_messages_ready{queue="email.transactional"}) or vector(0)
        threshold: "20"
        ignoreNullValues: "false"
